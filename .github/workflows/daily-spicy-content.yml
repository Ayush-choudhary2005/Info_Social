name: Daily spicy content generation

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC every day — offset from the other two jobs
  workflow_dispatch: {}    # lets you run it on demand from the Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Generate today's spicy content
        run: npm run generate-spicy-content
        env:
          GROQ_API_KEY_SPICY: ${{ secrets.GROQ_API_KEY_SPICY }}
          GROQ_API_KEY_SPICY_2: ${{ secrets.GROQ_API_KEY_SPICY_2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
